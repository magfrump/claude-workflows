# Egress allowlist for CRB review cells. See Dockerfile.proxy.
User tinyproxy
Group tinyproxy
Port 3128
Listen 0.0.0.0
Timeout 600
LogLevel Info
LogFile "/dev/stdout"
MaxClients 100
StartServers 2

# The proxy is reachable only from the internal `crb-inner` network, whose
# subnet run-host.sh pins so this line can be exact. It is ALSO attached to the
# default bridge (that is how it reaches the internet at all), so an open Allow
# would proxy for any other container on this host.
Allow 172.31.250.0/24

# CONNECT to 443 only, so an HTTPS tunnel cannot be repointed at an arbitrary
# service. NOTE what this does NOT do: ConnectPort scopes the CONNECT method
# alone. A plain `GET http://host/` is an ordinary forward-proxy request that
# never reaches this directive — HTTP_PROXY and http_proxy are both exported to
# every cell, so that path is live. It is the Filter below, not this line, that
# refuses a non-allowlisted host over plain HTTP; the preflight's `plain-http`
# leg is what proves it. (The earlier comment here credited ConnectPort with
# blocking plain HTTP. Two fact-check replicates caught it independently.)
ConnectPort 443

# The allowlist. FilterURLs Off => the filter matches the HOST, which for a
# CONNECT request is the tunnel target. FilterDefaultDeny inverts the usual
# sense: entries are what is ALLOWED, everything else is refused.
Filter "/etc/tinyproxy/filter"
FilterURLs Off
FilterExtended On
FilterCaseSensitive Off
FilterDefaultDeny Yes

DisableViaHeader Yes
